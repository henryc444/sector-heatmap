<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sector Heatmap — 行業熱度</title>
<style>
  :root { --bg:#000000; --panel:#0d0f14; --panel2:#11141b; --stroke:#1e2330;
          --text:#d8dce6; --sub:#6b7385; --dim:#4a5162;
          --yellow:#ffcc00; --orange:#ff9500; --up:#00c076; --down:#ff4d5e;
          --mono:'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--mono); font-size:12px; }
  /* ── Bloomberg-style command bar ── */
  header { background:var(--bg); border-bottom:1px solid var(--stroke); padding:0 14px;
    height:34px; display:flex; align-items:center; gap:14px; white-space:nowrap; }
  header h1 { font-size:13px; font-weight:700; color:var(--yellow); letter-spacing:.5px; }
  header .meta { color:var(--dim); font-size:11px; }
  .ctrl { display:flex; align-items:center; gap:2px; margin-left:auto; }
  .ctrl button { background:transparent; color:var(--sub); border:1px solid transparent;
    padding:2px 8px; font-size:11px; font-family:var(--mono); cursor:pointer; height:22px; }
  .ctrl button:hover { color:var(--yellow); border-color:var(--stroke); }
  .ctrl button.active { color:var(--bg); background:var(--yellow); border-color:var(--yellow); }
  .ctrl .sep { width:1px; height:14px; background:var(--stroke); margin:0 6px; }
  #refreshStatus { color:var(--dim); font-size:10px; }
  /* ── main two-pane layout ── */
  main { display:flex; height:calc(100vh - 34px - 26px); }
  #leftPane { flex:1; min-width:0; display:flex; flex-direction:column; padding:8px; }
  #splitter { width:5px; cursor:col-resize; background:var(--bg); border-left:1px solid var(--stroke);
    border-right:1px solid var(--stroke); flex:0 0 auto; }
  #splitter:hover, #splitter.dragging { background:var(--yellow); opacity:.6; }
  #chartPanel { flex:1; position:relative; background:#131722; border:1px solid var(--stroke);
    overflow:hidden; }
  #chartHint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:12px; z-index:1; flex-direction:column; gap:8px; }
  #rightPane { width:420px; min-width:340px; max-width:520px; border-left:1px solid var(--stroke);
    display:flex; flex-direction:column; }
  .rp-head { padding:6px 10px; border-bottom:1px solid var(--stroke); color:var(--yellow);
    font-size:11px; font-weight:700; letter-spacing:.5px; background:var(--panel); }
  /* sector/theme rank table */
  #sectorList { max-height:30%; overflow-y:auto; border-bottom:1px solid var(--stroke); }
  #sectorList table { width:100%; border-collapse:collapse; font-size:11px; }
  #sectorList th { position:sticky; top:0; background:var(--panel2); color:var(--sub);
    font-weight:600; text-align:left; padding:3px 8px; border-bottom:1px solid var(--stroke); }
  #sectorList td { padding:3px 8px; border-bottom:1px solid rgba(30,35,48,.5); cursor:pointer; }
  #sectorList tr:hover td { background:rgba(255,204,0,.06); }
  #sectorList tr.active td { background:rgba(255,204,0,.12); border-left:2px solid var(--yellow); }
  #sectorList tr.dragging td { opacity:.4; }
  #sectorList tr.drag-over td { border-top:2px solid var(--yellow); }
  #sectorList .num { text-align:right; font-variant-numeric:tabular-nums; }
  #sectorList .rank { color:var(--dim); width:22px; }
  .heatbar { display:inline-block; width:34px; height:6px; border-radius:1px; vertical-align:middle; margin-right:6px; }
  /* stock list table */
  #stockList { flex:1; overflow-y:auto; }
  #customBar { display:none; padding:6px 10px; border-bottom:1px solid var(--stroke);
    background:var(--panel); gap:6px; align-items:center; position:relative; }
  #customBar.show { display:flex; }
  #customBar input { flex:1; background:var(--bg); color:var(--text); border:1px solid var(--stroke);
    font-family:var(--mono); font-size:11px; padding:3px 8px; outline:none; height:24px; }
  #customBar input:focus { border-color:var(--yellow); }
  #customBar button { background:transparent; color:var(--yellow); border:1px solid var(--stroke);
    font-family:var(--mono); font-size:11px; padding:2px 10px; cursor:pointer; height:24px; }
  #customBar button:hover { background:var(--yellow); color:var(--bg); }
  #customSuggest { position:absolute; top:100%; left:10px; right:10px; background:var(--panel2);
    border:1px solid var(--stroke); border-top:none; max-height:220px; overflow-y:auto; display:none; z-index:50; }
  #customSuggest.show { display:block; }
  #customSuggest .sg { padding:4px 10px; cursor:pointer; font-size:11px; display:flex; gap:8px;
    align-items:center; justify-content:space-between; }
  #customSuggest .sg:hover, #customSuggest .sg.sel { background:rgba(255,204,0,.12); color:var(--yellow); }
  #customSuggest .sg .nm { color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #customSuggest .sg .ex { color:var(--dim); font-size:10px; flex:0 0 auto; }
  #customSuggest .sg.more { color:var(--dim); font-style:italic; justify-content:center; cursor:default; }
  .del { color:var(--dim); cursor:pointer; font-size:12px; padding:0 4px; opacity:0; }
  tr:hover .del { opacity:1; }
  .del:hover { color:var(--down); }
  #stockList table { width:100%; border-collapse:collapse; font-size:11px; }
  #stockList th { position:sticky; top:0; background:var(--panel2); color:var(--sub);
    font-weight:600; text-align:left; padding:3px 8px; border-bottom:1px solid var(--stroke); z-index:2; }
  #stockList td { padding:3px 8px; border-bottom:1px solid rgba(30,35,48,.4); cursor:pointer;
    font-variant-numeric:tabular-nums; }
  #stockList tr:hover td { background:rgba(255,204,0,.06); }
  #stockList tr.active td { background:rgba(255,204,0,.1); }
  #stockList .num { text-align:right; }
  #stockList .tkr { font-weight:700; color:var(--text); }
  #stockList .thm { color:var(--dim); font-size:10px; }
  /* bottom status bar */
  footer { height:26px; border-top:1px solid var(--stroke); display:flex; align-items:center;
    gap:16px; padding:0 14px; font-size:10px; color:var(--dim); overflow:hidden; white-space:nowrap; }
  #regimeBar { display:flex; gap:14px; }
  #regimeBar .tag { font-weight:700; }
  .tag-bull { color:var(--up); } .tag-bear { color:var(--down); }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--sub); }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--stroke); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--dim); }
</style>
</head>

<header>
  <h1>⚡ SECTOR MONITOR</h1>
  <span class="meta" id="meta"></span>

  <div class="ctrl">

    <button id="saveBtn" title="儲存介面設定">💾 SAVE</button>

</header>
<main>

      <button id="customAdd">＋ 加入</button>
      <div id="customSuggest"></div>
    </div>
    <div id="stockList"></div>
  </div>
</main>
<footer>

</footer>

function fmt(v, suffix='%') {
  if (v === null || v === undefined) return '—';
  const n = Number(v);
  if (isNaN(n)) return '—';
  return (n > 0 ? '+' : '') + n.toFixed(1) + suffix;

  return 'var(--sub)';

function heatColor(h) {

function renderSectors() {

  } else {

function selectSector(code, silent = false) {

function renderRegime() {
  const bar = document.getElementById('regimeBar');
  if (!REGIME || !Object.keys(REGIME).length) { bar.style.display = 'none'; return; }
  const items = Object.entries(REGIME).map(([k, r]) => {
    const d = r.ratio_60d;
    const tag = d >= 0 ? `<span class="tag tag-bull">擴張</span>` : `<span class="tag tag-bear">收縮</span>`;
    const pos = (r.ratio - r.ratio_lo_5y) / (r.ratio_hi_5y - r.ratio_lo_5y) * 100;
    return `<div class="item">${k}/SPY ${tag}
      <span style="color:${d>=0?'var(--up)':'var(--down)'}">60日 ${fmt(d)}</span>
      <span style="color:var(--sub)">5年位置 ${pos.toFixed(0)}%</span>
    </div>`;
  }).join('');
  bar.innerHTML = items;
}
// ── drag-to-reorder sector/theme rows ──
let dragCode = null
let dragMoved = false
function bindDrag() {
  const el = document.getElementById('sectorList')
  el.querySelectorAll('tr[draggable]').forEach(row => {
    row.addEventListener('dragstart', e => {
      dragCode = row.dataset.code
      dragMoved = true
      row.classList.add('dragging')
      e.dataTransfer.effectAllowed = 'move'
      e.dataTransfer.setData('text/plain', row.dataset.code)
    })
    row.addEventListener('dragend', () => {
      row.classList.remove('dragging')
      el.querySelectorAll('tr').forEach(r => r.classList.remove('drag-over'))
      setTimeout(() => { dragMoved = false }, 50)
    })
    row.addEventListener('dragover', e => {
      if (dragCode && dragCode !== row.dataset.code) { e.preventDefault(); row.classList.add('drag-over') }
    })
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'))
    row.addEventListener('drop', e => {
      e.preventDefault()
      row.classList.remove('drag-over')
      if (!dragCode || dragCode === row.dataset.code) return
      const pool = activeView === 'theme' ? THEMES : SECTORS
      const from = pool.findIndex(x => x.code === dragCode)
      const to = pool.findIndex(x => x.code === row.dataset.code)
      if (from < 0 || to < 0) return
      const [moved] = pool.splice(from, 1)
      pool.splice(to, 0, moved)
      userOrder[activeView] = pool.map(x => x.code)
      render()
      markUnsaved()
    })
  })
  el.addEventListener('click', e => {
    const row = e.target.closest('tr[data-code]')
    if (!row || dragMoved) { e.stopPropagation(); return }
  }, true)
}
function addCustom() {
  const inp = document.getElementById('customTicker')
  const t = (inp.value || '').trim().toUpperCase()
  if (!t) return
  if (!customTickers.includes(t)) {
    customTickers.push(t)
    saveCustom()
    // fetch live metrics for the new ticker if not in snapshot
    if (!METRICS[t]) fetchCustomMetric(t)
    render()
    markUnsaved()
  }
  inp.value = ''
  hideSuggest()
}
function removeCustom(t) {
  customTickers = customTickers.filter(x => x !== t)
  saveCustom()
  render()
  markUnsaved()
}
// ── ticker search with suggestions ──
const EXCH_CODE = { NMS: 'NASDAQ', NGM: 'NASDAQ', NCM: 'NASDAQ', NYQ: 'NYSE', NYE: 'NYSE', PCX: 'AMEX', ASE: 'AMEX' }
let suggestItems = []
let suggestSel = -1
function tickerName(c) {
  const sec = SECTORS.find(s => s.code === c)
  if (sec) return sec.label
  const thm = THEMES.find(s => s.code === c)
  if (thm) return thm.label
  return ''
}
async function searchTicker(q) {
  const url = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=8&newsCount=0`
  const j = await fetchYahoo(url)
  return (j.quotes || [])
    .filter(x => x.quoteType === 'EQUITY' || x.quoteType === 'ETF')
    .slice(0, 8)
    .map(x => ({ code: x.symbol.toUpperCase(), name: x.shortname || x.longname || '', ex: EXCH_CODE[x.exchange] || x.exchange }))
}
async function onTickerInput() {
  const q = document.getElementById('customTicker').value.trim().toUpperCase()
  const box = document.getElementById('customSuggest')
  if (!q) { hideSuggest(); return }
  // 1) known universe first (fast, offline)
  const known = Object.keys(METRICS).filter(c => c.includes(q)).slice(0, 6)
    .map(c => ({ code: c, name: tickerName(c), ex: 'universe' }))
  suggestItems = known
  if (known.length) {
    renderSuggest(q)
    return
  }
  // 2) Yahoo search for anything outside the universe (validates existence)
  box.classList.add('show')
  box.innerHTML = `<div class="sg more">🔎 搜尋中…</div>`
  try {
    suggestItems = await searchTicker(q)
    renderSuggest(q)
  } catch (e) {
    box.innerHTML = `<div class="sg more">⚠️ 搜尋失敗（網絡？）— 直接輸入仍可加入</div>`
  }
}
function renderSuggest(q) {
  const box = document.getElementById('customSuggest')
  if (!suggestItems.length) {
    box.innerHTML = `<div class="sg more">「${q}」冇結果 — 檢查 TICKER 或試簡稱（如 Apple）</div>`
    return
  }
  suggestSel = -1
  box.innerHTML = suggestItems.map((s, i) =>
    `<div class="sg" data-i="${i}" onclick="pickSuggest(${i})">` +
      `<span>${s.code}</span><span class="nm">${s.name}</span><span class="ex">${s.ex}</span></div>`
  ).join('') + (suggestItems.length ? `<div class="sg more">↑↓ 選擇 · Enter 加入</div>` : '')
}
function pickSuggest(i) {
  const s = suggestItems[i]
  if (!s) return
  document.getElementById('customTicker').value = s.code
  if (!customTickers.includes(s.code)) {
    customTickers.push(s.code)
    saveCustom()
    if (!METRICS[s.code]) fetchCustomMetric(s.code)
    render()
    markUnsaved()
  }
  hideSuggest()
}
function hideSuggest() { document.getElementById('customSuggest').classList.remove('show'); suggestItems = [] }
document.getElementById('customTicker').addEventListener('input', () => { onTickerInput() })
document.getElementById('customTicker').addEventListener('keydown', e => {
  if (e.key === 'Enter') { if (suggestSel >= 0) pickSuggest(suggestSel); else addCustom() }
  if (e.key === 'ArrowDown' && suggestItems.length) { e.preventDefault(); suggestSel = (suggestSel + 1) % suggestItems.length; markSel() }
  if (e.key === 'ArrowUp' && suggestItems.length) { e.preventDefault(); suggestSel = (suggestSel - 1 + suggestItems.length) % suggestItems.length; markSel() }
  if (e.key === 'Escape') hideSuggest()
})
function markSel() {
  document.querySelectorAll('#customSuggest .sg').forEach((el, i) => el.classList.toggle('sel', i === suggestSel))
}
document.addEventListener('click', e => { if (!e.target.closest('#customBar')) hideSuggest() })
async function fetchCustomMetric(t) {
  try {
    const spy = await fetchYahooChart('SPY')
    const closes = await fetchYahooChart(t)
    const m = computeHeatFromCloses(closes, spy)
    if (m) { METRICS[t] = m; EXCH[t] = EXCH[t] || 'NASDAQ:' + t; render() }
  } catch (e) { /* keep placeholder row */ }
}
document.getElementById('customAdd').addEventListener('click', addCustom)
document.getElementById('customTicker').addEventListener('keydown', e => { if (e.key === 'Enter') addCustom() })
// ── resizable splitter ──

// ── bright/dark theme + save prefs (localStorage) ──
const PREFS_KEY = 'sector_heat_prefs'
let prefsDirty = false
let userOrder = { sector: null, theme: null }
function loadPrefs() {
  try {
    const p = JSON.parse(__ls.getItem(PREFS_KEY) || '{}')
    if (p.theme) applyTheme(p.theme)
    if (p.period && ['rs_20','rs_60','rs_120','heat'].includes(p.period)) {
      activeKey = p.period
      document.querySelectorAll('.ctrl [data-k]').forEach(b => b.classList.toggle('active', b.dataset.k === activeKey))
    }
    if (p.cap && ['all','large','mid'].includes(p.cap)) {

      document.querySelectorAll('.ctrl [data-cap]').forEach(b => b.classList.toggle('active', b.dataset.cap === activeCap))
    }

      activeView = p.view
      document.querySelectorAll('.ctrl [data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === activeView))
    }
    if (p.order && p.order[activeView]) {

      userOrder.theme = p.order.theme || null
    }

function applyTheme(t) {

function markUnsaved() { prefsDirty = true; document.getElementById('saveBtn').classList.remove('saved') }
function savePrefs() {

  setTimeout(() => btn.classList.remove('saved'), 1200)

// ── live refresh via Yahoo public chart API (client-side) ──
// NOTE: Yahoo blocks direct browser CORS; file:// blocks most proxies.
// Proxy chain tries several; only works reliably over http://localhost.
const PROXIES = [
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
]
async function fetchYahoo(url) {
  let lastErr = null
  for (const mk of PROXIES) {
    try {
      const r = await fetch(mk(url))
      if (r.ok) return await r.json()
      lastErr = 'HTTP ' + r.status
    } catch (e) { lastErr = String(e).slice(0, 60) }
  }
  throw new Error('proxy fail: ' + lastErr)
}
function needsServer() {
  // file:// has no live Yahoo access — surface a hint once
  const box = document.getElementById('refreshStatus')
  if (location.protocol === 'file:' && box) {
    box.textContent = '⚠️ file:// 冇 live 數據 — 用 http://localhost:8731 開先有 ⟳/search'
  }
}
async function fetchYahooChart(sym, range = '1y') {
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${sym}?range=${range}&interval=1d`
  const j = await fetchYahoo(url)
  const res = j?.chart?.result?.[0]
  if (!res) throw new Error(`${sym} empty result`)
  const closes = res.indicators?.quote?.[0]?.close || []
  return closes.filter(v => v != null)
}
function computeHeatFromCloses(closes, spyCloses) {
  if (closes.length < 260 || spyCloses.length < 260) return null
  const cur = closes[closes.length - 1]
  const c20 = closes[closes.length - 21], c60 = closes[closes.length - 61], c120 = closes[closes.length - 121]
  const s20 = spyCloses[spyCloses.length - 21], s60 = spyCloses[spyCloses.length - 61], s120 = spyCloses[spyCloses.length - 121]
  const rs20 = (cur / c20 - 1) * 100 - (spyCloses[spyCloses.length - 1] / s20 - 1) * 100
  const rs60 = (cur / c60 - 1) * 100 - (spyCloses[spyCloses.length - 1] / s60 - 1) * 100
  const rs120 = (cur / c120 - 1) * 100 - (spyCloses[spyCloses.length - 1] / s120 - 1) * 100
  const ret120 = (cur / c120 - 1) * 100
  const hi = Math.max(...closes.slice(-252))
  const off52 = (cur / hi - 1) * 100
  const ma50 = closes.slice(-50).reduce((a, b) => a + b, 0) / 50
  const ma200 = closes.slice(-200).reduce((a, b) => a + b, 0) / 200
  const heat = Math.round(50 + rs20 * 0.6 + rs60 * 0.4 + Math.max(-25, Math.min(25, rs120 * 0.5)))
  return { heat: Math.max(0, Math.min(100, heat)), rs_20: +rs20.toFixed(2), rs_60: +rs60.toFixed(2),
           rs_120: +rs120.toFixed(2), ret_120: +ret120.toFixed(2), pct_off_52w_high: +off52.toFixed(2),
           above_ma50: cur > ma50, above_ma200: cur > ma200, live: true }
}
async function refreshSectors() {
  const btn = document.getElementById('refreshBtn')
  const status = document.getElementById('refreshStatus')
  btn.classList.add('loading')
  if (status) status.textContent = '更新中…'
  try {
    const spy = await fetchYahooChart('SPY')
    // batch: fetch each sector ETF sequentially (keep request count low)
    let ok = 0
    for (const s of SECTORS) {
      try {
        const closes = await fetchYahooChart(s.code)
        const m = computeHeatFromCloses(closes, spy)
        if (m) { Object.assign(s, m); ok++ }
      } catch (e) { /* keep old data for this sector */ }
    }
    // regime proxies
    for (const [k, r] of Object.entries(REGIME)) {
      try {
        const closes = await fetchYahooChart(k)
        const last = closes[closes.length - 1]
        const c60 = closes[closes.length - 61]
        r.ratio = last / spy[spy.length - 1]
        r.ratio_60d = ((last / c60) / (spy[spy.length - 1] / spy[spy.length - 61]) - 1) * 100
      } catch (e) {}
    }
    render()
    renderRegime()
    const t = new Date().toLocaleString()
    document.getElementById('meta').textContent = `已更新 ${t}（${ok}/${SECTORS.length} 個行業 live）`
    if (status) status.textContent = ''
  } catch (e) {
    if (status) status.textContent = '⚠️ 更新失敗（可能 rate-limited，等一陣再試）'
  } finally {
    btn.classList.remove('loading')
  }
}
document.getElementById('refreshBtn').addEventListener('click', refreshSectors)
document.getElementById('saveBtn').addEventListener('click', savePrefs)
// ── TradingView chart embed (P-HTML-45: free widget supports stocks/ETFs with
//    exchange prefix; indices/futures are premium-blocked — we only map stocks) ──
let tvWidgetLoaded = false
function showChart(code) {
  const sym = EXCH[code] || ('NASDAQ:' + code)
  document.querySelectorAll('#stockList tbody tr').forEach(r => r.classList.toggle('active', r.dataset.code === code))
  const panel = document.getElementById('chartPanel')
  const hint = document.getElementById('chartHint')
  panel.classList.add('show')
  hint.style.display = 'flex'
  if (!tvWidgetLoaded) {
    const s = document.createElement('script')
    s.src = 'https://s3.tradingview.com/tv.js'
    s.async = true
    s.onload = () => { tvWidgetLoaded = true; renderWidget(sym) }
    document.head.appendChild(s)
  } else {
    renderWidget(sym)
  }
}
function renderWidget(sym) {
  const hint = document.getElementById('chartHint')
  const holder = document.getElementById('tvHolder')
  if (holder) holder.remove()
  if (!window.TradingView || !window.TradingView.widget) {
    hint.style.display = 'flex'
    hint.textContent = '⚠️ TradingView 載入失敗（網絡被封？）'
    return
  }
  const div = document.createElement('div')
  div.id = 'tvHolder'
  div.style.cssText = 'position:absolute;inset:0;'
  document.getElementById('chartPanel').appendChild(div)
  new window.TradingView.widget({
    container_id: 'tvHolder',
    autosize: true,
    symbol: sym,
    interval: 'D',
    timezone: 'Asia/Hong_Kong',
    theme: 'dark',
    style: '1',
    locale: 'zh_TW',
    allow_symbol_change: true,
    details: true,
    hotlist: true,
    calendar: false,
    hide_side_toolbar: false
  })
  hint.style.display = 'none'
}
document.getElementById('themeToggle')?.remove?.()
document.getElementById('meta').textContent = `截至 ${SECTORS[0] ? new Date(SECTORS[0].__asof || Date.now()).toLocaleString() : ''} · ${SECTORS.length} 行業 · ${Object.values(STOCKS).flat().length} 股`;
loadCustom();
initSplitter();
loadPrefs();
needsServer();
renderRegime();
render();
</script>
